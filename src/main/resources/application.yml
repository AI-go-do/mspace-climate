# mspace-climate: 방 공기 이상 탐지·냉난방 자동 제어 (오디 공기 관리)
# 게이트웨이 → /api/climate/** 만 여기로. 센서 값은 게이트웨이가 /internal/sensor-events로 사본을 준다
server:
  port: ${PORT:8095}

spring:
  application:
    name: mspace-climate
  # 오디 공기 도구를 MCP로 연다(POST /mcp, 게이트웨이는 /api/climate/**만 열어서 밖에서는 안 보임).
  # 판단 에이전트(제미나이)가 여기로 붙고, 비서도 같은 도구를 쓸 수 있다
  ai:
    mcp:
      server:
        name: mspace-climate
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        instructions: "오디 공기 도구. 방 상태를 보고(room_status) 에어컨·환풍기·공기청정기를 켜고 끈다. 빈 방·자동 제어 끈 방·센서 끊긴 방에서는 켜지 않는다"

mspace:
  jwt:
    secret: ${JWT_SECRET:}          # core와 같은 값. 비면 켜지지 않는다
    issuer: ${JWT_ISSUER:mspace-core}

management:
  server:
    port: ${MANAGEMENT_PORT:8096}   # 자기 health는 다른 포트(밖으로 안 엶)
  endpoints:
    web:
      exposure:
        include: health

climate:
  core-uri: ${CORE_URI:http://core:8080}   # 관리자인지 core에 묻는다
  data-dir: ${CLIMATE_DATA_DIR:/data}      # 기준선 7일 기록 스냅숏 (도커 볼륨)
  tick: 60s                                # 오디 판단 간격
  # 방 번호 → 이름. 시연은 실습실 센서를 1번 방으로 친다(docs Q-21)
  rooms:
    1: 1번 방
    2: 2번 방
    3: 3번 방
    4: 4번 방
    5: 5번 방
  keep: 7d               # 기준선을 잡을 기록 기간
  k: 2.5                 # 경계 = 평균 ± 2.5 × 흩어짐
  min-samples: 30        # 30분 값이 모이기 전에는 안전 한계만 (학습 중)
  trend-window: 30m      # 최근 30분 추세
  min-trend-points: 5
  lead: 15m              # 15분 안에 경계에 닿을 것 같으면 미리 알림·제어
  stuck: 20m             # 20분 동안 값이 똑같으면 센서 멈춤 후보
  offline: 10m           # 10분 넘게 값이 없으면 끊김
  empty-off: 10m         # 빈 방 10분이면 기기 끔
  hold-manual: 30m       # 사람이 손으로 바꾼 기기는 30분 동안 오디가 안 건드림
  alert-every: 30m       # 같은 방·같은 알림은 30분에 한 번 (FR-DEV-104)
  # 안전 한계: 방마다 기준선이 이 안에서 정해진다. CO2 1000ppm은 팀 규칙(FR-DEV-104)
  rules:
    # CO2 위 경계는 1000 고정(fixed-upper): 실측 19일 채점에서 방 기준선 경계보다 헛알림이 50→16번(README 미리 환기 채점표)
    CO2:         { hard-max: 1000, min-band: 150, spike-jump: 400, fixed-upper: true }
    # 멈춤(값 그대로)은 CO2로만 본다(stuck-check: false). 온도 0.1°C·습도 0.5% 눈금이라 20분 그대로가 흔해
    # 실측 19일에 멈춤 헛알림 1,720번 → 0번(README 센서 고장 채점표 2판). 기기가 멈추면 CO2도 같이 멈춘다
    TEMPERATURE: { hard-min: 18, hard-max: 28, min-band: 1.5, spike-jump: 4, stuck-check: false }
    HUMIDITY:    { hard-min: 30, hard-max: 70, min-band: 8, spike-jump: 20, stuck-check: false }
  comfort:
    cool-min: 24
    cool-max: 26
    heat-min: 20
    heat-max: 22
  # 교육장 MQTT 브로커 직접 구독 (재웅 11/12). 계정은 .env의 CLIMATE_MQTT_USERNAME·PASSWORD. 계정이 비면 구독하지 않는다
  mqtt:
    enabled: ${CLIMATE_MQTT_ENABLED:true}
    uri: ${CLIMATE_MQTT_URI:tcp://data.withio.net:1883}
    username: ${CLIMATE_MQTT_USERNAME:}
    password: ${CLIMATE_MQTT_PASSWORD:}
    client-id: ${CLIMATE_MQTT_CLIENT_ID:}   # 비면 mspace-climate-<임의 6자리>. 같은 이름이 둘이면 브로커가 서로 끊는다(dev·prod·수집기)
    raw-topic: application/+/device/+/event/up
    location: 실습실         # 이 공간 센서만 받는다
    # 센서 자리 → 방 번호. 실습실 CO2 센서는 4개(후면 오른쪽 1분, 전방 좌측·후방 우측 2분, 전방 우측 10분).
    # 1~2분 간격 3개를 1~3번 방에, 4·5번 방은 1번 방 값으로 만든다(10분 센서는 그래프가 끊겨 보여서 뺌). /api/climate/sensors로 확인
    spots:
      "[후면 오른쪽]": 1
      "[전방 좌측]": 2
      "[후방 우측]": 3
    auto-rooms: []          # 설정에 없는 CO2 센서를 받은 순서대로 붙일 방 (비면 안 붙임)
    inference-topic: aip/team5/jaeung/inference/+/state   # 보드 A 시계열 모델 결과
  # 기기 목록. 비면 방마다 가상 에어컨(ac-N)·공기청정기(purifier-N)·환풍기(fan-N).
  # 실제 기기 예 (어댑터만 바꾸면 됨):
  #   - { id: ac-1, room: 1, kind: AIRCON, adapter: ir, brand: SAMSUNG, url: "http://<ESP32 노드>" }
  #   - { id: purifier-1, room: 1, kind: PURIFIER, adapter: tasmota, brand: 샤오미, url: "http://<플러그>" }
  # 실습실 센서가 멈췄을 때(11/8부터 LoRa 업링크 0건) 실측 녹화(10/21~11/8)를 N주 전 같은 시각으로 재생. 실제 값이 오면 그 방은 실제 값
  replay:
    enabled: ${CLIMATE_REPLAY_ENABLED:false}
    backfill-minutes: 120
  # 방 공기 시뮬레이션 (재웅 11/12, FR-DEV-107). 실습실 센서가 멈춘 동안 1초마다 방 5개 값을 만들고, 오디가 켠 기기가 값에 반영된다.
  # 가끔(평균 25분) 사람이 있는 방 하나에 온도 상승을 만든다. 재실은 core 방 현황(실제 예약·입실)을 쓴다. 실제 값이 오는 방은 실제 값을 쓴다. 화면에는 "시뮬레이션"
  sim:
    enabled: ${CLIMATE_SIM_ENABLED:true}
    backfill-minutes: 180
    event-every-minutes: 25
    judge-every-seconds: 10
  appliances: []
  # 방 사용자 알림: core에 부탁(POST {core-url}/internal/air-alerts). 토큰이 비면 관리자 화면에만 보인다
  notify:
    core-url: ${CLIMATE_NOTIFY_CORE_URL:http://core:8080}   # 도커 안쪽 core (게이트웨이를 거치지 않음)
    token: ${CLIMATE_SERVICE_TOKEN:}
  # 제미나이 판단 에이전트 (재웅 11/12). 키가 비면 규칙만으로 판단한다(지금과 같음).
  # 무료 등급은 비서와 같은 키라 분당 15·하루 500 → 여기서 시간당 4번·하루 40번까지만 묻고, 넘으면 규칙으로
  judge:
    enabled: ${CLIMATE_JUDGE_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${CLIMATE_JUDGE_MODEL:gemini-3.5-flash-lite}
    mcp-url: http://localhost:${server.port}   # 자기 자신의 MCP (/mcp는 클라이언트가 붙임)
    max-per-hour: 4
    max-per-day: 40
    max-turns: 5
    timeout: 15s
  # 실제 공기 센서는 실습실(1번 방) 하나. 2~5번 방은 1번 방 실제 값 + 방마다 작은 차이 + 느린 흔들림으로 만든다(시뮬레이션, 화면에 표시).
  # 실제 센서를 다는 방은 여기서 빼면 그 방 센서 값을 그대로 쓴다
  derive:
    source-room: 1
    rooms:
      2: { temp: 0.6,  humidity: -3, co2: 40,  temp-wobble: 0.3, humidity-wobble: 1.5, co2-wobble: 25, period: 47 }
      3: { temp: -0.5, humidity: 2,  co2: -30, temp-wobble: 0.2, humidity-wobble: 1.0, co2-wobble: 20, period: 61 }
      4: { temp: 0.3,  humidity: 4,  co2: 20,  temp-wobble: 0.3, humidity-wobble: 2.0, co2-wobble: 30, period: 37 }
      5: { temp: 0.9,  humidity: -2, co2: 80,  temp-wobble: 0.4, humidity-wobble: 1.5, co2-wobble: 40, period: 53 }
